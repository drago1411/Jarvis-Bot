<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JARVIS — Agent Home</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="orb"></span>
        <h1>JARVIS</h1>
        <span class="tag">Agent Home</span>
      </div>
      <div class="status">
        <span id="status-dot" class="dot"></span>
        <span id="status-text">Checking Ollama…</span>
      </div>
    </header>

    <main class="layout">
      <!-- Dashboard -->
      <section class="dashboard">
        <div class="grid">
          <div class="card stat">
            <span class="label">Ollama</span>
            <strong id="widget-ollama">…</strong>
          </div>
          <div class="card stat">
            <span class="label">Model</span>
            <strong id="widget-model">…</strong>
          </div>
          <div class="card stat">
            <span class="label">Session time</span>
            <strong id="widget-clock">–:–:–</strong>
          </div>
          <div class="card stat">
            <span class="label">Messages</span>
            <strong id="widget-count">0</strong>
          </div>
        </div>

        <div class="card activity">
          <h2>Recent activity</h2>
          <ul id="activity-list" class="activity-list">
            <li class="empty">No activity yet — say hello below.</li>
          </ul>
        </div>
      </section>
    </main>

    <!-- Chat text bar -->
    <footer class="chatbar">
      <form id="chat-form" autocomplete="off">
        <input
          id="chat-input"
          type="text"
          placeholder="Message JARVIS…"
          autofocus
        />
        <button type="submit" id="send-btn">Send</button>
      </form>
      <div id="typing" class="typing hidden">JARVIS is thinking…</div>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
